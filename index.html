<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eye Simulation</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="eye-bar">
    <div class="eye-pick">
      <!-- Phones only: the current eye type; tapping it opens the eye type list below. -->
      <button type="button" id="eyeTypeToggle" class="eye-type-toggle" aria-expanded="false" aria-controls="eyeButtons"></button>
      <nav id="eyeButtons" class="eye-buttons" aria-label="Eye type"></nav>
      <div class="pick-row">
        <label class="example-pick">
          <span data-tip="Animals with this eye type. Picking one loads its settings onto the same eye.">Example:</span>
          <select id="exampleSelect"></select>
        </label>
        <div id="spectrum" class="spectrum"></div>
      </div>
    </div>
    <button type="button" id="resetButton" class="reset-button">↺ Reset</button>
  </header>

  <main class="layout">
    <aside class="panel settings-panel" aria-labelledby="settings-h">
      <h2 id="settings-h">Settings</h2>
      <div id="settings" class="settings"></div>
    </aside>

    <section class="eye-stage" aria-label="3D eye">
      <!-- Above the 3D view, not over it, so nothing here covers the model. -->
      <div class="stage-top">
        <div class="stage-row">
          <div class="ray-buttons" id="rayButtons" role="group" aria-label="Light rays">
            <button type="button" class="ray-button ray-button--uv" data-ray="uv" aria-pressed="false">UV</button>
            <button type="button" class="ray-button ray-button--ir" data-ray="ir" aria-pressed="false">IR</button>
          </div>
          <p class="stage-hint"><span class="hint-wide">Drag to rotate · Scroll to zoom · Hover a part to learn what it does</span><span class="hint-phone">Drag to rotate · Pinch to zoom</span></p>
        </div>
        <p id="eyeNote" class="eye-note" hidden></p>
      </div>
      <div id="eyeView" class="eye-view"></div>
      <p id="eyeMissing" class="eye-missing" hidden></p>
      <div class="stage-tools">
        <label class="cut-control">
          <span>Cut open</span>
          <input type="range" id="cutSlider" min="0" max="100" step="1" value="0">
          <output id="cutValue" for="cutSlider">0%</output>
        </label>
        <button type="button" id="labelsToggle" class="toggle-button" aria-pressed="true">Labels</button>
      </div>
    </section>

    <aside class="panel sight-panel" aria-labelledby="sight-h">
      <h2 id="sight-h">How it sees</h2>
      <div id="sight" class="sight"></div>
    </aside>
  </main>

  <!-- Phones only: one section at a time. -->
  <nav class="phone-tabs" aria-label="Sections">
    <button type="button" data-tab="eye" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>
      <span>3D eye</span>
    </button>
    <button type="button" data-tab="sight" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>
      <span>How it sees</span>
    </button>
    <button type="button" data-tab="settings" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
